<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ArcadeX · Administração</title><link rel="stylesheet" href="/css/styles.css">
<style>body{padding:0}.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh}aside a{display:block;padding:10px 12px;border-radius:9px;color:var(--muted);font-weight:600;cursor:pointer}aside a.on,aside a:hover{background:#ffffff0d;color:var(--text)}
main{padding:24px;min-width:0}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:12px}.scroll{overflow-x:auto}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.k .stat b{font-size:28px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fg .w{grid-column:1/-1}.bars{display:flex;align-items:end;gap:8px;height:120px}.bars div{flex:1;background:var(--grad);border-radius:6px 6px 0 0;position:relative;min-height:2px}.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}.fg{grid-template-columns:1fr}}</style></head>
<body><div id="app"></div><div id="modal"></div><div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module" src="/admin/admin.js"></script></body></html>
