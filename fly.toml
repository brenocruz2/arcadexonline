# fly.toml app configuration file generated for arcadexonline on 2026-10-31T08:57:53Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'arcadexonline'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGIN = 'https://arcadexonline.fly.dev'
  NODE_ENV = 'production'
  ROM_DIR = '/app/retroarch/cores/roms'

[[mounts]]
  source = 'storage'
  destination = '/app/storage'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
