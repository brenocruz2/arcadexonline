app = "arcadexonline"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  ALLOWED_ORIGIN = "https://arcadexonline.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "storage"
  destination = "/app/storage"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1